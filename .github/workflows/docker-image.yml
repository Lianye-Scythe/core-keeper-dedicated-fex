name: FEX ARM64 image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      check_for_changes:
        description: Skip the build when published image inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: fex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.classify.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether an image build is required
        id: classify
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B .github/scripts/image-changes.py
  lint:
    name: Shell script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          for file in scripts/*.sh fex/*.sh tests/*.sh ops/diagnostics/*.sh; do bash -n "$file"; done
          shellcheck -S warning scripts/*.sh fex/*.sh tests/*.sh ops/diagnostics/*.sh
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
  releases:
    name: Resolve stable dependencies
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    outputs:
      depot: ${{ steps.depot.outputs.version }}
      asset: ${{ steps.depot.outputs.asset }}
    steps:
      - name: Read latest non-prerelease DepotDownloader
        id: depot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/SteamRE/DepotDownloader/releases/latest)
          version=$(jq -er .tag_name <<< "$release")
          version=${version#DepotDownloader_}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset=$(jq -er '[.assets[] | select(.name == "DepotDownloader-linux-arm64.zip") | .id]
            | if length == 1 then .[0] else error("Missing or ambiguous ARM64 asset") end' <<< "$release")
          [[ $asset =~ ^[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
  image:
    name: Build FEX ARM64 image
    needs: [changes, lint, releases]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check ARM64 image inputs
        id: inputs
        env:
          IMAGE: ghcr.io/${{ vars.IMAGE_REPOSITORY || github.repository }}
          CHECK_INPUTS: ${{ github.event_name == 'schedule' || inputs.check_for_changes == true }}
          DEPOT_VERSION: ${{ needs.releases.outputs.depot }}
          DEPOT_ASSET: ${{ needs.releases.outputs.asset }}
        run: python3 -B .github/scripts/image-inputs.py
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.inputs.outputs.build == 'true'
      - name: Build (no publication before smoke test)
        if: steps.inputs.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: corekeeper-fex:check
          add-hosts: ${{ steps.inputs.outputs.hosts }}
          labels: io.github.corekeeper.build-inputs=${{ steps.inputs.outputs.fingerprint }}
          build-args: |
            APT_REFRESH_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
            ROOTFS_BASE=${{ steps.inputs.outputs.rootfs }}
            RUNTIME_BASE=${{ steps.inputs.outputs.runtime }}
            DEPOT_DOWNLOADER_VERSION=${{ needs.releases.outputs.depot }}
          cache-from: type=gha,scope=fex
          cache-to: type=gha,scope=fex,mode=max
      - name: Native guest and entry smoke tests
        if: steps.inputs.outputs.build == 'true'
        env:
          GUEST_URL: ${{ steps.inputs.outputs.guest_url }}
          GUEST_HASH: ${{ steps.inputs.outputs.guest_hash }}
        run: |
          docker run --rm --network none --entrypoint cat corekeeper-fex:check \
            /opt/fex-rootfs-source.json | jq -e --arg url "$GUEST_URL" --arg hash "$GUEST_HASH" \
            '.source.URL == $url and .source.Hash == $hash' >/dev/null
          docker run --rm --network none --entrypoint bash -v "$PWD:/test-repo:ro" \
            corekeeper-fex:check /test-repo/tests/fex-image-smoke.sh
          docker run --rm --network none --entrypoint bash -v "$PWD:/test-repo:ro" \
            -v "$PWD/tests/setup-stub.sh:/home/steam/scripts/setup.sh:ro" \
            corekeeper-fex:check /test-repo/tests/entry-smoke.sh
      - name: Publish tested FEX image (main only)
        if: steps.inputs.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          # Existing public GHCR package remains linked after repository rename.
          # Other forks default to their own repository; this project sets the var.
          IMAGE: ghcr.io/${{ vars.IMAGE_REPOSITORY || github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          docker tag corekeeper-fex:check "$image:fex"
          docker tag corekeeper-fex:check "$image:latest"
          docker tag corekeeper-fex:check "$image:fex-${COMMIT}"
          docker push "$image:fex-${COMMIT}"
          docker push "$image:fex"
          docker push "$image:latest"
  fex:
    # Preserve the existing required-check name without weakening branch protection.
    name: Build and smoke-test FEX ARM64
    needs: [changes, lint, releases, image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks or a documentation-only skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          IMAGE_REQUIRED: ${{ needs.changes.outputs.image }}
          RELEASES_RESULT: ${{ needs.releases.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$LINT_RESULT" = success
          case "$IMAGE_REQUIRED" in
            true)
              test "$RELEASES_RESULT" = success
              test "$IMAGE_RESULT" = success
              echo "Image checks passed (tested build or unchanged scheduled inputs)."
              ;;
            false)
              test "$RELEASES_RESULT" = skipped
              test "$IMAGE_RESULT" = skipped
              echo "Documentation-only change: checks passed; no image built or published."
              ;;
            *) exit 1 ;;
          esac
